
configurations {
    proguardTool
}

dependencies {
    proguardTool 'com.guardsquare:proguard-base:7.4.2'
}

def isProguardEnabled = { ->
    return project.findProperty('rainydlcProguard') != 'false' &&
           project.findProperty('proguard') != 'false'
}

def isCertBindEnabled = { ->
    return project.findProperty('rainydlcCertBind') != 'false'
}

def protectedJarFile = layout.buildDirectory.file('libs/rainydlc-protected.jar')
def proguardJarFile = layout.buildDirectory.file('libs/rainydlc-proguard.jar')
def mappingFile = layout.buildDirectory.file('protection/mapping.txt')
def keystoreFile = file('protection/keystore.jks')
def signingPropsFile = file('protection/signing.properties')

def signingPassword = { ->
    def props = new Properties()
    if (signingPropsFile.exists()) {
        signingPropsFile.withInputStream { props.load(it) }
    }
    def pw = props.getProperty('storePassword')
    if (pw == null || pw.isEmpty()) {
        pw = new BigInteger(160, new java.security.SecureRandom()).toString(36)
        signingPropsFile.parentFile.mkdirs()
        signingPropsFile.text = "# сгенерировано автоматически, не коммитить\nstorePassword=${pw}\n"
    }
    return pw
}

tasks.register('proguardJar', JavaExec) {
    group = 'protection'
    description = 'Обфускация переименованием (ProGuard). Отключается через -PrainydlcProguard=false'
    onlyIf { isProguardEnabled() }
    dependsOn tasks.named('remapJar')

    classpath = configurations.proguardTool
    mainClass = 'proguard.ProGuard'

    doFirst {
        def inJar = tasks.named('remapJar').get().archiveFile.get().asFile
        def outJar = proguardJarFile.get().asFile
        outJar.parentFile.mkdirs()

        def runtimeRules = layout.buildDirectory.file('protection/proguard-runtime.rules')
        runtimeRules.get().asFile.parentFile.mkdirs()
        mappingFile.get().asFile.parentFile.mkdirs()

        def javaHome = System.getProperty('java.home')
        def jmods = new File(javaHome, 'jmods')
        def jmodLine = jmods.exists() ? "-libraryjars ${jmods.absolutePath}(!**.jar;!module-info.class)" : ""

        def libLines = sourceSets.client.runtimeClasspath.files
                .findAll { it.name.endsWith('.jar') }
                .collect { "-libraryjars ${it.absolutePath}" }
                .join('\n')

        runtimeRules.get().asFile.text = """
-injars ${inJar.absolutePath}
-outjars ${outJar.absolutePath}
-printmapping ${mappingFile.get().asFile.absolutePath}
${jmodLine}
${libLines}
"""
        args("-include", file('protection/proguard.rules').absolutePath,
             "-include", runtimeRules.get().asFile.absolutePath)
    }
}

tasks.register('encryptJar', DefaultTask) {
    group = 'protection'
    description = 'AES-256-GCM шифрование ядра с ключом, привязанным к целостности jar'
    dependsOn tasks.named('remapJar')
    if (isProguardEnabled()) {
        dependsOn 'proguardJar'
    }
    if (isCertBindEnabled()) {
        dependsOn 'genKeystore'
    }

    doLast {
        def inJar = isProguardEnabled()
                ? proguardJarFile.get().asFile
                : tasks.named('remapJar').get().archiveFile.get().asFile
        def outJar = protectedJarFile.get().asFile
        outJar.parentFile.mkdirs()

        def encryptor = new rainydlc.ClassEncryptor()
        if (isCertBindEnabled()) {
            encryptor.setKeystore(keystoreFile, signingPassword())
        } else {
            encryptor.setCertBind(false)
        }
        encryptor.run(inJar, outJar)
    }
}

tasks.register('protectJar') {
    group = 'protection'
    description = 'Полный цикл защиты: ProGuard -> AES-шифрование ядра -> подпись jar'
    if (isCertBindEnabled()) {
        dependsOn 'signProtectedJar'
    } else {
        dependsOn 'encryptJar'
    }
}

def keystoreUsable = { ->
    if (!keystoreFile.exists()) return false
    try {
        def ks = java.security.KeyStore.getInstance(keystoreFile.name.endsWith('.p12') ? 'PKCS12' : 'JKS')
        keystoreFile.withInputStream { ks.load(it, signingPassword().toCharArray()) }
        return ks.getCertificate('rainydlc') != null
    } catch (Throwable t) {
        return false
    }
}

tasks.register('genKeystore', Exec) {
    group = 'protection'
    description = 'Генерирует keystore для подписи'
    onlyIf { !keystoreUsable() }
    doFirst {
        keystoreFile.parentFile.mkdirs()
        if (keystoreFile.exists()) {
            logger.lifecycle("[protection] keystore не открывается текущим паролем — пересоздаю "
                    + keystoreFile.absolutePath)
            keystoreFile.delete()
        }
    }
    commandLine 'keytool', '-genkeypair',
            '-alias', 'rainydlc',
            '-keyalg', 'RSA', '-keysize', '2048',
            '-validity', '3650',
            '-dname', 'CN=RainyDLC, O=RainyDLC',
            '-keystore', keystoreFile.absolutePath,
            '-storepass', signingPassword(),
            '-keypass', signingPassword()
}

def jarsignerBin = { ->
    def home = System.getProperty('java.home')
    def exe = new File(home, 'bin/jarsigner.exe')
    if (!exe.exists()) exe = new File(home, 'bin/jarsigner')
    return exe.exists() ? exe.absolutePath : 'jarsigner'
}

tasks.register('signProtectedJar', Exec) {
    group = 'protection'
    description = 'Подписывает защищённый JAR (подпись делается ПОСЛЕ шифрования)'
    dependsOn 'encryptJar', 'genKeystore'
    executable = jarsignerBin()
    args '-keystore', keystoreFile.absolutePath,
         '-storepass', signingPassword(),
         '-keypass', signingPassword(),
         '-digestalg', 'SHA-256',
         protectedJarFile.get().asFile.absolutePath,
         'rainydlc'
}
