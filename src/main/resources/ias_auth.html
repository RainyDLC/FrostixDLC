<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>In-Game Account Switcher</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            background: #1b1b22;
            color: #e8e8f0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        main {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            box-sizing: border-box;
        }
        .icon {
            font-size: 64px;
            line-height: 1;
            margin-bottom: 16px;
        }
        .message {
            font-size: 20px;
            max-width: 640px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
<main>
    <div class="icon">%%ias_icon%%</div>
    <div class="message">%%ias_message%%</div>
</main>
</body>
</html>
