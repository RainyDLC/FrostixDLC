plugins {
    id 'fabric-loom' version '1.15.5'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()
    accessWidenerPath = file("src/client/resources/client.accesswidener")
    mods {
        "rainydlc" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    ivy {
        name = 'localLibs'
        url = uri('libs')
        patternLayout {
            artifact '[artifact]-[revision](-[classifier]).[ext]'
        }
        metadataSources {
            artifact()
        }
    }
    mavenCentral()
    maven { url = "https://maven.meteordev.org/snapshots" }
    maven { url = "https://babbaj.github.io/maven/" }
}


def bundleLibsInJar = true

def mediaPlayerInfo = "dev.redstones.mediaplayerinfo:media-player-info:${media_player_info_version}"
def kotlinStdlib = "org.jetbrains.kotlin:kotlin-stdlib:${kotlin_version}"
def kotlinxSerialization = "org.jetbrains.kotlinx:kotlinx-serialization-core-jvm:${kotlinx_serialization_version}"
def luaj = "org.luaj:luaj-jse:3.0.1"

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    modImplementation include("meteordevelopment:baritone:${project.baritone_version}")
    runtimeOnly "dev.babbaj:nether-pathfinder:1.4.1"

    modLocalRuntime fileTree(dir: 'run/mods', include: ['*.jar'])

    implementation 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'

    if (bundleLibsInJar) {
        modImplementation include(mediaPlayerInfo)
        modImplementation include(kotlinStdlib)
        modImplementation include(kotlinxSerialization)
        modImplementation include(luaj)
    } else {
        compileOnly mediaPlayerInfo
        compileOnly kotlinStdlib
        compileOnly kotlinxSerialization
        compileOnly luaj

        modLocalRuntime mediaPlayerInfo
        modLocalRuntime kotlinStdlib
        modLocalRuntime kotlinxSerialization
        modLocalRuntime luaj
    }
}

tasks.register('copyRuntimeLibs', Copy) {
    group = 'build'
    description = 'Копирует vendored-либы в build/libs/ (только bundle_libs_in_jar=false)'
    onlyIf { !bundleLibsInJar }
    from("libs/media-player-info-${media_player_info_version}.jar")
    from("libs/kotlin-stdlib-${kotlin_version}.jar")
    from("libs/kotlinx-serialization-core-jvm-${kotlinx_serialization_version}.jar")
    into(layout.buildDirectory.dir('libs'))
}

tasks.register('copyModRuntimeToMods', Copy) {
    group = 'build'
    description = 'Копирует modLocalRuntime в mods/ (только bundle_libs_in_jar=false)'
    onlyIf { !bundleLibsInJar }
    from(configurations.modLocalRuntime)
    into('mods')
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

if (!bundleLibsInJar) {
    tasks.named('build') {
        dependsOn 'copyRuntimeLibs'
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset = "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    if (project.findProperty('rainydlcSources') == 'true') {
        withSourcesJar()
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
    repositories {
    }
}

apply from: 'protect.gradle'
